<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="100%" stop-color="#EFE8D8"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D99B3B"/>
      <stop offset="100%" stop-color="#B2741E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2C2621" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#2C2621"/>
  
  <!-- Subtle Inner Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#D99B3B" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Open Book Wings -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M256 360 C 220 342, 160 340, 110 354 L 110 186 C 160 172, 220 174, 256 192 Z" 
          fill="url(#parchment)" stroke="#3E362F" stroke-width="3"/>
    <!-- Left Page Texture Lines -->
    <line x1="140" y1="220" x2="225" y2="216" stroke="#C4B9A5" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="250" x2="225" y2="246" stroke="#C4B9A5" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="280" x2="225" y2="276" stroke="#C4B9A5" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="310" x2="200" y2="307" stroke="#C4B9A5" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Page -->
    <path d="M256 360 C 292 342, 352 340, 402 354 L 402 186 C 352 172, 292 174, 256 192 Z" 
          fill="url(#parchment)" stroke="#3E362F" stroke-width="3"/>
    <!-- Right Page Texture Lines -->
    <line x1="287" y1="216" x2="372" y2="220" stroke="#C4B9A5" stroke-width="3" stroke-linecap="round"/>
    <line x1="287" y1="246" x2="372" y2="250" stroke="#C4B9A5" stroke-width="3" stroke-linecap="round"/>
    <line x1="287" y1="276" x2="372" y2="280" stroke="#C4B9A5" stroke-width="3" stroke-linecap="round"/>
    <line x1="287" y1="307" x2="347" y2="310" stroke="#C4B9A5" stroke-width="3" stroke-linecap="round"/>

    <!-- Book Spine -->
    <path d="M252 190 L 260 190 L 260 365 L 252 365 Z" fill="#2C2621"/>
  </g>

  <!-- Golden Quill / Bookmark Star Rising -->
  <g>
    <!-- Bookmark ribbon dropping -->
    <path d="M246 360 L 256 415 L 266 360 Z" fill="url(#amberGold)"/>

    <!-- Quill Stylus / Star at the top center -->
    <path d="M256 120 L 268 152 L 300 155 L 275 176 L 282 208 L 256 190 L 230 208 L 237 176 L 212 155 L 244 152 Z" 
          fill="url(#amberGold)" stroke="#FAF8F1" stroke-width="2"/>
    <circle cx="256" cy="168" r="4" fill="#FAF8F1"/>
  </g>
</svg>
